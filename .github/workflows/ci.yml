name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check coaforge tests benchmarks
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Smoke run (small budget)
        run: python -m coaforge scenarios/northern_bastion.yaml --out smoke --generations 4 --pop 16 --runs 32 --final-runs 200
